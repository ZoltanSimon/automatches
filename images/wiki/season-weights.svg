<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="t d" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title id="t">How much a start counts, by season</title>
  <desc id="d">A start this season counts in full, last season half, two seasons ago a quarter, three seasons ago an eighth and four seasons ago a sixteenth. Ten starts in each season are worth 10, 5, 2.5, 1.25 and 0.63 weighted starts.</desc>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="32" y="40" font-size="24" font-weight="700" fill="#1D3557" text-anchor="start">Recent seasons count more</text>
  <text x="32" y="64" font-size="16" font-weight="400" fill="#4A5A70" text-anchor="start">Each season back halves the weight of a start (seasons run July to June)</text>
  <text x="32" y="120" font-size="16" font-weight="600" fill="#101D30" text-anchor="start">This season</text>
  <rect x="200" y="100" width="360" height="28" rx="5" fill="#F1FAEE"/>
  <rect x="200" y="100" width="360.0" height="28" rx="5" fill="#279B65"/>
  <text x="574" y="120" font-size="17" font-weight="700" fill="#1D3557" text-anchor="start">× 1</text>
  <text x="768" y="120" font-size="15" font-weight="400" fill="#4A5A70" text-anchor="end">10 starts = 10</text>
  <text x="32" y="166" font-size="16" font-weight="600" fill="#101D30" text-anchor="start">Last season</text>
  <rect x="200" y="146" width="360" height="28" rx="5" fill="#F1FAEE"/>
  <rect x="200" y="146" width="180.0" height="28" rx="5" fill="#457B9D"/>
  <text x="574" y="166" font-size="17" font-weight="700" fill="#1D3557" text-anchor="start">× ½</text>
  <text x="768" y="166" font-size="15" font-weight="400" fill="#4A5A70" text-anchor="end">10 starts = 5.0</text>
  <text x="32" y="212" font-size="16" font-weight="600" fill="#101D30" text-anchor="start">2 seasons ago</text>
  <rect x="200" y="192" width="360" height="28" rx="5" fill="#F1FAEE"/>
  <rect x="200" y="192" width="90.0" height="28" rx="5" fill="#457B9D"/>
  <text x="574" y="212" font-size="17" font-weight="700" fill="#1D3557" text-anchor="start">× ¼</text>
  <text x="768" y="212" font-size="15" font-weight="400" fill="#4A5A70" text-anchor="end">10 starts = 2.5</text>
  <text x="32" y="258" font-size="16" font-weight="600" fill="#101D30" text-anchor="start">3 seasons ago</text>
  <rect x="200" y="238" width="360" height="28" rx="5" fill="#F1FAEE"/>
  <rect x="200" y="238" width="45.0" height="28" rx="5" fill="#457B9D"/>
  <text x="574" y="258" font-size="17" font-weight="700" fill="#1D3557" text-anchor="start">× ⅛</text>
  <text x="768" y="258" font-size="15" font-weight="400" fill="#4A5A70" text-anchor="end">10 starts = 1.3</text>
  <text x="32" y="304" font-size="16" font-weight="600" fill="#101D30" text-anchor="start">4 seasons ago</text>
  <rect x="200" y="284" width="360" height="28" rx="5" fill="#F1FAEE"/>
  <rect x="200" y="284" width="22.5" height="28" rx="5" fill="#457B9D"/>
  <text x="574" y="304" font-size="17" font-weight="700" fill="#1D3557" text-anchor="start">× 1/16</text>
  <text x="768" y="304" font-size="15" font-weight="400" fill="#4A5A70" text-anchor="end">10 starts = 0.63</text>
</svg>
