<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title id="t">The fourteen player roles on the pitch</title>
  <desc id="d">A pitch with the team attacking to the right. From the goal outwards: GK, then CB with LB and RB either side, LWB and RWB wider and further up, DM, CM with LM and RM, AM, LW and RW on the wings, and ST up front.</desc>
