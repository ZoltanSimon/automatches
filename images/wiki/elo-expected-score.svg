  <circle cx="425.0" cy="238.0" r="7" fill="#457B9D" stroke="#FFFFFF" stroke-width="2"/>
  <text x="437.0" y="274.0" font-size="15" font-weight="700" fill="#457B9D" text-anchor="start">Equal ratings, neutral venue: 0.50</text>
  <circle cx="508.8" cy="198.2" r="7" fill="#279B65" stroke="#FFFFFF" stroke-width="2"/>
  <text x="522.8" y="232.2" font-size="15" font-weight="700" fill="#279B65" text-anchor="start">Equal ratings, at home (+100): 0.64</text>
  <circle cx="592.5" cy="164.2" r="7" fill="#1D3557" stroke="#FFFFFF" stroke-width="2"/>
  <text x="606.5" y="194.2" font-size="15" font-weight="700" fill="#1D3557" text-anchor="start">200 points stronger: 0.76</text>
  <text x="425" y="430" font-size="15" font-weight="600" fill="#4A5A70" text-anchor="middle">Rating difference (team − opponent, after home advantage)</text>
</svg>
