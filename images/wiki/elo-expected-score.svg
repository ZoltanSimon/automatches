<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title id="t">Elo expected score by rating difference</title>
  <desc id="d">An S-shaped curve. With equal ratings at a neutral venue a team's expected score is 0.50. The 100-point home advantage lifts it to 0.64, and a 200-point edge gives about 0.76.</desc>
  <rect width="800" height="440" fill="#FFFFFF"/>
  <text x="32" y="40" font-size="24" font-weight="700" fill="#1D3557" text-anchor="start">Expected score before kick-off</text>
  <text x="32" y="64" font-size="16" font-weight="400" fill="#4A5A70" text-anchor="start">1 = win, 0.5 = draw, 0 = loss. The gap includes home advantage.</text>
  <line x1="90" y1="96" x2="90" y2="380" stroke="#D5E3EA"/>
  <text x="90" y="402" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="middle">-400</text>
  <line x1="173.75" y1="96" x2="173.75" y2="380" stroke="#D5E3EA"/>
  <text x="173.75" y="402" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="middle">-300</text>
  <line x1="257.5" y1="96" x2="257.5" y2="380" stroke="#D5E3EA"/>
  <text x="257.5" y="402" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="middle">-200</text>
  <line x1="341.25" y1="96" x2="341.25" y2="380" stroke="#D5E3EA"/>
  <text x="341.25" y="402" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="middle">-100</text>
  <line x1="425" y1="96" x2="425" y2="380" stroke="#D5E3EA"/>
  <text x="425" y="402" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="middle">0</text>
  <line x1="508.75" y1="96" x2="508.75" y2="380" stroke="#D5E3EA"/>
  <text x="508.75" y="402" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="middle">+100</text>
  <line x1="592.5" y1="96" x2="592.5" y2="380" stroke="#D5E3EA"/>
  <text x="592.5" y="402" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="middle">+200</text>
  <line x1="676.25" y1="96" x2="676.25" y2="380" stroke="#D5E3EA"/>
  <text x="676.25" y="402" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="middle">+300</text>
  <line x1="760" y1="96" x2="760" y2="380" stroke="#D5E3EA"/>
  <text x="760" y="402" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="middle">+400</text>
  <line x1="90" y1="380" x2="760" y2="380" stroke="#D5E3EA"/>
  <text x="80" y="385" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="end">0.00</text>
  <line x1="90" y1="309" x2="760" y2="309" stroke="#D5E3EA"/>
  <text x="80" y="314" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="end">0.25</text>
  <line x1="90" y1="238" x2="760" y2="238" stroke="#D5E3EA"/>
  <text x="80" y="243" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="end">0.50</text>
  <line x1="90" y1="167" x2="760" y2="167" stroke="#D5E3EA"/>
  <text x="80" y="172" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="end">0.75</text>
  <line x1="90" y1="96" x2="760" y2="96" stroke="#D5E3EA"/>
  <text x="80" y="101" font-size="14" font-weight="400" fill="#4A5A70" text-anchor="end">1.00</text>
